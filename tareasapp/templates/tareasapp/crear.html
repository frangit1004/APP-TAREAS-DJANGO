<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear tarea</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 80%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
        }

        .checkbox input {
            width: auto;
        }

        .acciones {
            text-align: center;
            margin-top: 20px;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .boton:hover {
            background-color: #555;
        }

        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h1>📝 Crear nueva tarea</h1>

    <div class="panel">
        <form method="POST">

            {% csrf_token %}

            <div>
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <div>
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
            </div>

            <label class="checkbox">
                <input type="checkbox" name="completada">
                Tarea completada
            </label>

            <div class="acciones">
                <button type="submit" class="boton">
                    Guardar tarea
                </button>
            </div>

        </form>
    </div>

    <div class="acciones">
        <a href="/" class="volver">← Volver al inicio</a>
    </div>

</div>

</body>
</html>
